name: Validate Data

on:
  pull_request:
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'schemas/**'
      - 'README.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Schemas (incl. date formats), unique IDs, duplicate arXiv IDs/DOIs, URLs,
      # and category and framework references
      - name: Validate data
        run: python scripts/validate_data.py

      - name: Check README counts match the data
        run: python scripts/sync_readme_counts.py --check
