name: Fetch New Papers

on:
  schedule:
    # Run every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger
    inputs:
      dry_run:
        description: 'Fetch and deduplicate, but do not create or update the PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # merge-base with auto/papers needs history

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # Each fetcher exits non-zero if its source failed outright; the run
      # carries on with the other sources and the health report flags it.
      - name: Fetch from arXiv
        run: python scripts/fetch_arxiv.py
        continue-on-error: true

      - name: Fetch from Semantic Scholar
        run: python scripts/fetch_semantic_scholar.py
        continue-on-error: true
        env:
          # Optional repository secret; without it the shared rate limit applies
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

      - name: Fetch from CrossRef
        run: python scripts/fetch_crossref.py
        continue-on-error: true

      - name: Report source health
        id: health
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/fetch_common.py --report | tee source_health.md
          { echo "### Source health"; echo; cat source_health.md; } >> "$GITHUB_STEP_SUMMARY"

      # One rolling PR instead of one per week: entries from the still-open
      # PR are carried into this run, so nothing unmerged is lost when the
      # branch is rebuilt from main. A closed (rejected) PR is not carried over.
      - name: Collect entries from the open auto-fetch PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --head auto/papers --state open --json number --jq length)
          if [ "$open" != "0" ] && git fetch origin auto/papers; then
            git show FETCH_HEAD:data/literature.json > pending_literature.json
            # Entries inherited from main at branch time are not the PR's own
            git show "$(git merge-base HEAD FETCH_HEAD)":data/literature.json > pending_base.json
          fi

      - name: Deduplicate and merge
        id: dedup
        run: |
          set -o pipefail
          pending=()
          [ -f pending_literature.json ] && pending=(--pending pending_literature.json --pending-base pending_base.json)
          python scripts/deduplicate.py "${pending[@]}" | tee dedup_output.txt
          # Check if new entries were added
          if grep -q "No new entries to add" dedup_output.txt; then
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
            # Extract the summary for PR body
            sed -n '/--- New Entries ---/,$p' dedup_output.txt > new_entries_summary.txt
          fi

      - name: Validate data
        if: steps.dedup.outputs.has_new == 'true'
        run: python scripts/validate_data.py

      - name: Sync README counts
        if: steps.dedup.outputs.has_new == 'true'
        run: python scripts/sync_readme_counts.py

      - name: Compose PR body
        if: steps.dedup.outputs.has_new == 'true'
        run: |
          {
            echo "## Automated Paper Fetch"
            echo
            echo "New papers discovered from arXiv, Semantic Scholar, and CrossRef. This PR is"
            echo "updated every week until merged; unmerged entries carry over between runs."
            echo
            echo "**All entries are marked \`reviewed: false\`** -- please review before merging."
            echo
            echo "### Source health (latest run)"
            echo
            cat source_health.md 2>/dev/null || echo "_Health report unavailable._"
            echo
            echo "### New Entries"
            echo
            echo '```'
            # PR bodies are capped at 65536 characters; a long-lived rolling
            # PR can accumulate more entries than that. The diff has them all.
            head -c 60000 new_entries_summary.txt
            echo '```'
            if [ "$(wc -c < new_entries_summary.txt)" -gt 60000 ]; then
              echo
              echo "*Summary truncated -- see the Files changed tab for the full list.*"
            fi
            echo
            echo "---"
            echo "*Last updated by the weekly paper fetch workflow (run #${{ github.run_number }}, trigger: ${{ github.event_name }}).*"
          } > pr_body.md

      - name: Summarise dry run
        if: inputs.dry_run && steps.dedup.outputs.has_new == 'true'
        run: |
          {
            echo "### Dry run: entries that would be proposed"
            echo
            echo '```'
            head -c 60000 new_entries_summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create Pull Request
        if: steps.dedup.outputs.has_new == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@v8
        with:
          branch: auto/papers
          add-paths: |
            data/literature.json
            README.md
          commit-message: "auto: add new papers from weekly fetch"
          title: "auto: new LLM security papers"
          body-path: pr_body.md
          labels: auto-fetch,new-resource
          assignees: emmanuelgjr

      - name: Clean up candidate files
        if: always()
        run: rm -f scripts/candidates_*.json pending_literature.json pending_base.json source_health.md dedup_output.txt new_entries_summary.txt pr_body.md

      # A scheduled run that silently fetches nothing looks green; fail it so
      # GitHub notifies the maintainer when every source is down.
      - name: Fail if no source delivered
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::No enabled source returned papers -- see the Source health summary."
          exit 1
